[build]
  # Deepen history (if shallow) so generate-sitemap can read each file's last
  # git commit date for lastmod — otherwise a redeploy resets every lastmod to
  # the deploy date. Harmless (|| true) when the clone is already complete.
  command = "git fetch --unshallow 2>/dev/null || true; node scripts/render-answers.js && node scripts/generate-sitemap.js && node scripts/guard-analytics.js"
  publish = "."

[[redirects]]
  from = "/Blog/*"
  to = "/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*.html"
  to = "/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# pretty_urls DISABLED — it prevented .html → clean URL 301 redirects
# from firing (pretty_urls serves files at both /foo and /foo.html,
# so the redirect rules above never matched). Netlify still serves
# foo.html at /foo by default without pretty_urls enabled.

# Shared consent/layout assets must always revalidate — never cached as
# immutable — so a change (e.g. the oaiq.js consent gate) reaches every
# visitor. oaiq.js is also version-busted (?v=YYYYMMDD) in the page refs;
# these headers are the belt-and-braces at the CDN layer.
[[headers]]
  for = "/oaiq.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/responsive.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
